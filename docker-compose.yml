services:
  db:
    image: postgres:latest
    container_name: postgres_local
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    ports:
      - '${DATABASE_PORT}:5432'
    volumes:
      - ./db:/var/lib/postgresql/data

volumes:
  postgres_data:
    # external: true
