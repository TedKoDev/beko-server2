version: '3.8'

services:
  db:
    image: postgres:latest
    container_name: postgres_local
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    ports:
      - '${DATABASE_PORT}:5432'
    volumes:
      - ./db:/var/lib/postgresql/data
  prisma:
    image: node:16
    volumes:
      - .:/app
    working_dir: /app
    depends_on:
      - db
    networks:
      - default
    entrypoint: ["sh", "-c", "npx prisma migrate dev --schema=prisma/postsql.prisma --name init"]

volumes:
  postgres_data:
